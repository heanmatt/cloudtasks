# Single-Host AWS EC2 Deployment & Local Stack (No Conflict with Jenkins on :8080)
# Exposes:
#   - Port 8081 -> Nginx Reverse Proxy (http://<EC2_PUBLIC_IP>:8081)
#   - Port 3000 -> Web Frontend Direct (http://<EC2_PUBLIC_IP>:3000)
#   - Port 4000 -> REST API Direct     (http://<EC2_PUBLIC_IP>:4000/api/health)
#   - (Port 8080 is left free for Jenkins CI/CD Server!)
services:
  nginx:
    build: ./nginx
    image: heanmatt/cloudtasks-nginx:${APP_VERSION:-latest}
    container_name: cloudtasks-nginx
    ports:
      - "8081:80"
    depends_on:
      - web
      - api
    restart: unless-stopped

  web:
    build:
      context: ./services/web
      args:
        APP_VERSION: ${APP_VERSION:-2.1.0}
    image: heanmatt/cloudtasks-web:${APP_VERSION:-latest}
    container_name: cloudtasks-web
    ports:
      - "3000:3000"
    restart: unless-stopped

  api:
    build:
      context: ./services/api
      args:
        APP_VERSION: ${APP_VERSION:-2.1.0}
    image: heanmatt/cloudtasks-api:${APP_VERSION:-latest}
    container_name: cloudtasks-api
    ports:
      - "4000:4000"
    environment:
      REDIS_URL: redis://redis:6379
      APP_VERSION: ${APP_VERSION:-2.1.0}
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cloudtasks-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
